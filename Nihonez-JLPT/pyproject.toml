[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nihonez-jlpt"
version = "0.1.0"
description = "Turn saved Nihonez JLPT exam pages into markdown."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13,<5",
]

[project.scripts]
nihonez-jlpt = "nihonez_jlpt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
